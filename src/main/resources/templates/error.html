<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/layout :: head('Error')}"></head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Có lỗi xảy ra</h1>
          <p>Đã xảy ra lỗi trong quá trình xử lý yêu cầu.</p>
        </div>

        <div class="alert error">
          <p th:text="${message}">Error</p>
        </div>

        <div class="auth-footer">
          <a class="button full" th:href="@{/}">Về trang chủ</a>
        </div>
      </div>
    </div>
  </body>
</html>
