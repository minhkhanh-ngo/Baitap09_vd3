<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Đăng nhập</h1>
          <p>Đăng nhập để tiếp tục sử dụng hệ thống</p>
        </div>

        <div th:if="${param.error}" class="alert error">
          Username/password không đúng hoặc tài khoản chưa được xác thực.
        </div>

        <div th:if="${param.logout}" class="alert success">
          Bạn đã đăng xuất.
        </div>

        <div
          th:if="${success}"
          class="alert success"
          th:text="${success}"
        ></div>

        <form th:action="@{/login}" method="post">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              placeholder="Nhập username"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <button class="button full" type="submit">Đăng nhập</button>
        </form>

        <div class="auth-links">
          <a th:href="@{/register}">Tạo tài khoản</a>
          <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </div>
      </div>
    </div>
  </body>
</html>
