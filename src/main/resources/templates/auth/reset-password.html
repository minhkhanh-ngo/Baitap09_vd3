<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Đặt lại mật khẩu</h1>
          <p>Nhập OTP và mật khẩu mới của bạn</p>
        </div>

        <form
          th:action="@{/reset-password}"
          th:object="${resetPasswordDTO}"
          method="post"
        >
          <div
            th:if="${success}"
            class="alert success"
            th:text="${success}"
          ></div>

          <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              th:field="*{email}"
              placeholder="Nhập địa chỉ email"
              required
            />
          </div>

          <div class="form-group">
            <label for="otp">OTP</label>
            <input
              id="otp"
              name="otp"
              maxlength="6"
              placeholder="Nhập mã OTP 6 số"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu mới</label>
            <input
              id="password"
              type="password"
              th:field="*{password}"
              placeholder="Nhập mật khẩu mới"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input
              id="confirmPassword"
              type="password"
              th:field="*{confirmPassword}"
              placeholder="Nhập lại mật khẩu mới"
              required
            />
          </div>

          <button class="button full" type="submit">Đổi mật khẩu</button>
        </form>
      </div>
    </div>
  </body>
</html>
