<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <form
          th:action="@{/forgot-password}"
          th:object="${forgotPasswordDTO}"
          method="post"
        >
          <div class="auth-header">
            <h1>Quên mật khẩu</h1>
            <p>Nhập email của bạn để nhận mã OTP</p>
          </div>

          <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              th:field="*{email}"
              placeholder="Nhập địa chỉ email"
              required
            />
          </div>

          <button class="button full">Gửi OTP</button>
        </form>

        <div class="auth-footer">
          <span>Nhớ mật khẩu?</span>
          <a th:href="@{/login}">Quay lại đăng nhập</a>
        </div>
      </div>
    </div>
  </body>
</html>
