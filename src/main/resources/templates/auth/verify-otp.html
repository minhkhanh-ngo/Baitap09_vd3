<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>

<body>
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-header">
            <h1>Xác nhận OTP</h1>
            <p>Nhập mã OTP đã được gửi đến email của bạn</p>
        </div>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <form
                th:action="@{/verify-otp}"
                th:object="${verifyOtpDTO}"
                method="post">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}"
                   th:text="${e}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                        id="email"
                        type="email"
                        th:field="*{email}"
                        placeholder="Nhập địa chỉ email"
                        required
                />

                <p
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}"
                        class="field-error">
                </p>
            </div>

            <div class="form-group">
                <label for="otp">OTP 6 số</label>
                <input
                        id="otp"
                        type="text"
                        th:field="*{otp}"
                        maxlength="6"
                        inputmode="numeric"
                        placeholder="Nhập mã OTP"
                        required
                />

                <p
                        th:if="${#fields.hasErrors('otp')}"
                        th:errors="*{otp}"
                        class="field-error">
                </p>
            </div>

            <button class="button full" type="submit">
                Xác nhận
            </button>
        </form>

        <div class="otp-resend">
            <p>Chưa nhận được mã OTP?</p>

            <form
                    th:action="@{/resend-register-otp}"
                    method="post"
                    class="mt">

                <input
                        type="hidden"
                        name="email"
                        th:value="${verifyOtpDTO.email}"
                />

                <button class="button secondary full" type="submit">
                    Gửi lại OTP
                </button>
            </form>
        </div>

        <div class="auth-footer">
            <a th:href="@{/login}">
                Quay lại đăng nhập
            </a>
        </div>

    </div>
</div>
</body>
</html>
