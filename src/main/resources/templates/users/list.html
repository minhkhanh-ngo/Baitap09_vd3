<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Users')}"></head>
<body>
<div th:replace="~{layouts/layout :: page (~{::main})}">
    <main>

    <div class="page-heading products-heading">
        <div>
            <span class="page-eyebrow">USER MANAGEMENT</span>
            <h1>Quản lý Users</h1>
            <p class="page-description">
                Quản lý tài khoản, vai trò và trạng thái người dùng.
            </p>
        </div>

        <a
            class="button"
            th:href="@{/users/create}">
            + Thêm User
        </a>
    </div>

    <div
        th:if="${success}"
        class="alert success"
        th:text="${success}">
    </div>

    <div class="product-toolbar">

        <form
            th:action="@{/users}"
            method="get"
            class="product-search">

            <div class="search-input">
                <input
                    name="keyword"
                    th:value="${keyword}"
                    placeholder="Username, email, họ tên...">
            </div>

            <input
                type="hidden"
                name="size"
                th:value="${size}">

            <button
                class="button"
                type="submit">
                Tìm kiếm
            </button>

        </form>

    </div>

    <div class="table-card">

        <div class="table-header">
            <div>
                <h2>Danh sách Users</h2>
                <span>Thông tin tài khoản người dùng trong hệ thống</span>
            </div>
        </div>

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Họ tên</th>
                        <th>Role</th>
                        <th>Enabled</th>
                        <th>Products</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="u : ${users.content}">

                        <td>
                            <span
                                class="id-badge"
                                th:text="${u.id}">
                            </span>
                        </td>

                        <td>
                            <span
                                class="user-name"
                                th:text="${u.username}">
                            </span>
                        </td>

                        <td>
                            <span
                                class="user-email"
                                th:text="${u.email}">
                            </span>
                        </td>

                        <td th:text="${u.fullName}"></td>

                        <td>
                            <span
                                class="role-badge"
                                th:text="${u.roleName}">
                            </span>
                        </td>

                        <td>
                            <span
                                class="status-badge"
                                th:classappend="${u.enabled ? 'active' : 'inactive'}"
                                th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}">
                            </span>
                        </td>

                        <td>
                            <span
                                class="product-count"
                                th:text="${u.productCount}">
                            </span>
                        </td>

                        <td>
                            <div class="actions">

                                <a
                                    class="action-edit"
                                    th:href="@{/users/edit/{id}(id=${u.id})}">
                                    Edit
                                </a>

                                <form
                                    th:action="@{/users/delete/{id}(id=${u.id})}"
                                    method="post"
                                    onsubmit="return confirm('Xóa user này?')">

                                    <button
                                        class="danger-link"
                                        type="submit">
                                        Delete
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${users.empty}">
                        <td colspan="8">
                            <div class="empty-state">
                                <strong>Không có dữ liệu</strong>
                                <span>Không tìm thấy user phù hợp.</span>
                            </div>
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </div>

    <div class="pagination">

        <a
            th:if="${users.hasPrevious()}"
            th:href="@{/users(page=${users.number - 1}, size=${size}, keyword=${keyword})}">
            «
        </a>

        <span
            th:each="i : ${#numbers.sequence(0, users.totalPages > 0 ? users.totalPages - 1 : 0)}">

            <a
                th:classappend="${i == users.number ? 'active' : ''}"
                th:href="@{/users(page=${i}, size=${size}, keyword=${keyword})}"
                th:text="${i+1}">
            </a>

        </span>

        <a
            th:if="${users.hasNext()}"
            th:href="@{/users(page=${users.number + 1}, size=${size}, keyword=${keyword})}">
            »
        </a>

    </div>

</main>

</div>
</body>
</html>
